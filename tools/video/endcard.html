<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>마무리 카드</title>
<style>
:root{--blue:#124eeb;--ink:#000;--muted:#616161}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;overflow:hidden;font-family:"Noto Sans KR","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink)}
.bg{position:absolute;inset:0;overflow:hidden}
.bg iframe{width:100%;height:100%;border:0;filter:blur(5px);opacity:.28;transform:scale(1.04);pointer-events:none}
.veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.85) 45%,rgba(255,255,255,.92))}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 28px;gap:18px}
.tag{font-size:13px;font-weight:600;color:var(--blue);letter-spacing:.02em}
.tip{display:flex;gap:12px;align-items:flex-start;opacity:0;transform:translateY(14px);transition:opacity .4s,transform .4s}
.tip.on{opacity:1;transform:none}
.tip.off{opacity:0;transition:opacity .3s}
.tip .n{flex:none;width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:600}
.tip p{margin:0;font-size:22px;line-height:1.35;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.tip p small{display:block;font-size:14px;font-weight:400;color:var(--muted);margin-top:4px}
.last{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;opacity:0;transition:opacity .4s;text-align:center;padding:0 28px}
.last.on{opacity:1}
.last b{font-size:26px;font-weight:600;letter-spacing:-.02em}
.last span{font-size:14px;color:var(--muted)}
.brand{position:absolute;left:0;right:0;bottom:36px;text-align:center;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="bg"><iframe src="/index.html" title="배경"></iframe></div>
<div class="veil"></div>
<div class="wrap" id="wrap">
  <div class="tag">AI 꿀팁 한 줄</div>
  <div class="tip" id="t1"><span class="n">1</span><p>떨리는 건 실력이 아니라<br>연습 부족<small>티켓팅도 면접도 발표도 같아요</small></p></div>
  <div class="tip" id="t2"><span class="n">2</span><p>AI에게 「연습용 ○○」를<br>만들어 달라고 하기<small>실제와 같은 흐름만 있으면 충분해요</small></p></div>
  <div class="tip" id="t3"><span class="n">3</span><p>가짜 결제, 개인정보 입력 없음<small>연습용이라 마음 놓고 실수해도 돼요</small></p></div>
</div>
<div class="last" id="last"><b>프롬프트 전문은<br>고정 댓글에</b><span>설계서를 AI와 다듬은 뒤 생성했습니다</span></div>
<div class="brand">Rehearsal Ticket · 연습용 가상 예매 사이트</div>
<script>
const $ = id => document.getElementById(id);
window.__go = function () {
  const t0 = performance.now();
  const at = (sec, fn) => setTimeout(fn, Math.max(0, sec * 1000 - (performance.now() - t0)));
  at(0.1, () => $('t1').classList.add('on'));
  at(2.0, () => $('t2').classList.add('on'));
  at(4.0, () => $('t3').classList.add('on'));
  at(6.0, () => { ['t1', 't2', 't3'].forEach(i => $(i).classList.add('off')); $('wrap').querySelector('.tag').style.opacity = 0; });
  at(6.3, () => $('last').classList.add('on'));
};
</script>
</body>
</html>
