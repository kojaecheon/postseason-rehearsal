<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>프롬프트 재연</title>
<style>
:root{--blue:#124eeb;--line:#e5e7eb;--muted:#616161;--ink:#000}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:var(--ink);font-family:"Noto Sans KR","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.top b{font-size:15px;font-weight:600;letter-spacing:-.01em}
.chip{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.chat{padding:16px 14px 0;display:flex;flex-direction:column;gap:12px}
.me{align-self:flex-end;max-width:94%;background:var(--blue);color:#fff;border-radius:16px 16px 4px 16px;padding:11px 13px;font-size:14px;line-height:1.5;letter-spacing:-.01em;white-space:pre-wrap;min-height:48px}
.me .cur{display:inline-block;width:2px;height:1em;background:#fff;vertical-align:-2px;margin-left:1px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ai{align-self:flex-start;max-width:92%;background:#f3f4f6;border-radius:16px 16px 16px 4px;padding:12px 14px;font-size:14px;line-height:1.5;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s}
.ai.on{opacity:1;transform:none}
.code{margin:0 14px;background:#0f172a;color:#cbd5e1;border-radius:12px;padding:12px 12px 10px;font:11px/1.4 Consolas,"Cascadia Mono",ui-monospace,monospace;height:190px;overflow:hidden;opacity:0;transition:opacity .3s;position:relative}
.code.on{opacity:1}
.code .ln{white-space:pre;color:#94a3b8}
.code .ln b{color:#7dd3fc;font-weight:400}
.code .bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:#1e293b}
.code .bar i{display:block;height:100%;width:0;background:#38bdf8;transition:width .25s linear}
.file{margin:14px 14px 0;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s}
.file.on{opacity:1;transform:none}
.file .ico{width:40px;height:46px;border:2px solid var(--blue);border-radius:6px;position:relative;flex:none}
.file .ico::after{content:"HTML";position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:9px;font-weight:700;color:var(--blue)}
.file b{display:block;font-size:13px;font-weight:600;word-break:break-all}
.file small{color:var(--muted);font-size:12px}
.file .ok{margin-left:auto;background:#ecfdf3;color:#0f8a4a;font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;white-space:nowrap}
.send{align-self:flex-end;font-size:11px;color:var(--muted);opacity:0;transition:opacity .2s}
.send.on{opacity:1}
</style>
</head>
<body>
<div class="top"><b>AI 코딩 도우미</b><span class="chip">실제 프롬프트 재연</span></div>
<div class="chat">
  <div class="me" id="me"><span class="cur" id="cur"></span></div>
  <div class="send" id="send">전송됨</div>
  <div class="ai" id="ai">설계서대로 만들게요. 대기열, 보안문자, 좌석 선택, 결제, 예매 내역까지 HTML 파일 하나에 넣습니다.</div>
</div>
<div class="code" id="code"><div id="lines"></div><div class="bar"><i id="bar"></i></div></div>
<div class="file" id="file"><div class="ico"></div><div><b>postseason-rehearsal.artifact.html</b><small id="meta">생성 중</small></div><span class="ok">완성</span></div>
<script>
const PROMPT = '실제 예매처처럼 긴장되는 티켓팅 연습 사이트를 HTML 파일 하나로 만들어 줘. 카운트다운, 예매 버튼 반응속도 측정, 18만 명 대기열, 보안문자, 좌석 선택, 권종, 결제, 예매 내역까지 전부 가짜로 돌아가게. 구장과 대기 인원을 고를 수 있고, 새로고침하면 순번이 맨 뒤로 밀리는 것도 체험하게 해 줘. 실제 결제나 개인정보 입력은 없어야 해.';
const TYPE_SEC = 6.4, CODE_START = 7.0, CODE_SEC = 4.2, FILE_AT = 11.3;
const $ = id => document.getElementById(id);
let srcLines = [], total = 0, bytes = 0;
fetch('/postseason-rehearsal.artifact.html').then(r => r.text()).then(t => {
  bytes = new Blob([t]).size; const all = t.split('\n'); total = all.length;
  const i0 = Math.max(0, all.findIndex(l => l.includes('<script')));
  srcLines = all.slice(i0 + 1).filter(l => l.trim().length > 0).slice(0, 400);
  window.__ready = true;
}).catch(() => { srcLines = ['// 소스 불러오기 실패']; window.__ready = true; });
function esc(s) { return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
window.__go = function () {
  const t0 = performance.now(); const me = $('me'), cur = $('cur');
  let shown = 0, codeIdx = 0, started = false, fileOn = false, sendOn = false;
  function tick() {
    const t = (performance.now() - t0) / 1000;
    const n = Math.min(PROMPT.length, Math.floor(PROMPT.length * Math.min(1, t / TYPE_SEC)));
    if (n !== shown) { shown = n; me.textContent = PROMPT.slice(0, n); me.appendChild(cur); }
    if (t >= TYPE_SEC + 0.2 && !sendOn) { sendOn = true; cur.remove(); $('send').classList.add('on'); }
    if (t >= CODE_START && !started) { started = true; $('ai').classList.add('on'); $('code').classList.add('on'); }
    if (started) {
      const want = Math.min(srcLines.length, Math.floor(srcLines.length * Math.min(1, (t - CODE_START) / CODE_SEC)));
      if (want > codeIdx) {
        const box = $('lines');
        for (; codeIdx < want; codeIdx++) { const d = document.createElement('div'); d.className = 'ln'; d.innerHTML = esc(srcLines[codeIdx]).replace(/^(\s*)(const|let|function|if|for|return)\b/, '$1<b>$2</b>'); box.appendChild(d); }
        while (box.children.length > 12) box.removeChild(box.firstChild);
        $('bar').style.width = Math.round(want / srcLines.length * 100) + '%';
      }
    }
    if (t >= FILE_AT && !fileOn) { fileOn = true; $('meta').textContent = Math.round(bytes / 1024) + ' KB · ' + total.toLocaleString('ko-KR') + '줄 · 외부 라이브러리 없음'; $('file').classList.add('on'); }
    if (t < 13) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
};
</script>
</body>
</html>
