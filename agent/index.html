<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>티켓 비서</title>
<link rel="icon" href="data:,">
<style>
:root{
  color-scheme:light;
  --bg:#ffffff;--surface:#f9fafb;--surface-2:#f3f4f6;
  --text:#000000;--text-2:#3d3d3d;--muted:#616161;
  --line:#e5e7eb;--line-2:#d1d5db;
  --primary:#124eeb;--primary-hover:#0f42c9;--blue-soft:#eef3ff;--blue-line:#9db4f5;
  --good:#0f8a4a;--good-bg:#ecfdf3;--warn:#b45309;--warn-bg:#fff7e6;--bad:#dc2626;--bad-bg:#fef2f2;
  --r-sm:6px;--r-md:8px;--r-lg:12px;
  --font:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:ui-monospace,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.6 var(--font);letter-spacing:-.005em;word-break:keep-all;overflow-wrap:break-word}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font-family:inherit;font-size:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
a{color:var(--primary)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.any{overflow-wrap:anywhere;word-break:break-all}
.wrap{max-width:720px;margin:0 auto;padding-left:16px;padding-right:16px}

/* 상단 바 */
.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)}
.top__in{max-width:720px;margin:0 auto;padding:8px 16px 6px}
.top__row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top__name{font-weight:700;font-size:15px;letter-spacing:-.02em;color:#000;text-decoration:none}
.top__home{margin-left:auto;font-size:13px;padding:4px 10px;border:1px solid var(--line-2);border-radius:var(--r-md);text-decoration:none;color:#000}
.tag{font:500 11px/1.5 var(--font);color:var(--primary);background:var(--blue-soft);border:1px solid var(--blue-line);border-radius:999px;padding:0 7px;white-space:nowrap}
.steps{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:2px 10px;font-size:11.5px;color:var(--muted)}
.steps li{white-space:nowrap}
.steps li[aria-current="step"]{color:#000;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.steps .no{font-family:var(--mono)}

/* 지킴이 띠 */
.strip{background:var(--surface);border-top:1px solid var(--line);font-size:13px}
.strip__in{max-width:720px;margin:0 auto;padding:6px 16px;display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center}
.strip[data-alert="1"]{background:var(--bad-bg)}

/* 본문 */
main{padding-top:16px;padding-bottom:24px;min-height:60vh}
main:focus{outline:none}
.h1{font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1.35}
.h2{font-size:18px;font-weight:700;letter-spacing:-.02em;margin-bottom:8px}
.h3{font-size:15px;font-weight:700;margin-bottom:6px}
.lead{color:var(--text-2);margin-top:6px}
.muted{color:var(--muted)}
.small{font-size:13px}
.sec{border-top:1px solid var(--line);padding:16px 0;margin-top:16px}
.sec:first-child{border-top:0;margin-top:0;padding-top:0}
.stack{display:grid;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:480px){.grid3{grid-template-columns:minmax(0,1fr)}}
.box{border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;background:#fff}
.box--soft{background:var(--surface)}
ul.plain{margin:0;padding-left:18px}
ul.plain li{margin:2px 0}
ol.plain{margin:0;padding-left:20px}
ol.plain li{margin:2px 0}

/* 버튼 */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 14px;border:1px solid var(--line-2);border-radius:var(--r-md);background:#fff;color:#000;font-weight:500;line-height:1.25;text-align:center;cursor:pointer;text-decoration:none;max-width:100%}
.btn:hover{background:var(--surface)}
.btn--primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn--primary:hover{background:var(--primary-hover)}
.btn--danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn--danger:hover{background:#b91c1c}
.btn--big{min-height:56px;font-size:17px;font-weight:700;padding:0 20px}
.btn--block{width:100%}
.btn--sm{min-height:34px;font-size:13px;padding:0 10px}
.btn:disabled,.btn[aria-disabled="true"]{cursor:not-allowed;background:var(--surface-2);border-color:var(--line);color:#9ca3af}
.btn[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--primary);color:var(--primary-hover);box-shadow:inset 0 0 0 1px var(--primary)}
.btn--emph{outline:3px solid var(--warn);outline-offset:2px}
.demo{display:grid;gap:4px}
.demo .btn{width:100%}

/* 표시 */
.badge{display:inline-block;font-size:12px;font-weight:600;line-height:1.5;padding:0 8px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--text-2);white-space:nowrap}
.badge--good{color:var(--good);background:var(--good-bg);border-color:rgba(15,138,74,.35)}
.badge--warn{color:var(--warn);background:var(--warn-bg);border-color:rgba(180,83,9,.35)}
.badge--bad{color:var(--bad);background:var(--bad-bg);border-color:rgba(220,38,38,.35)}
.badge--info{color:var(--primary);background:var(--blue-soft);border-color:var(--blue-line)}
.src{font-size:11.5px;font-weight:600;color:var(--primary);border:1px dashed var(--blue-line);border-radius:var(--r-sm);padding:0 6px;white-space:nowrap}
.msg{overflow-wrap:anywhere;padding:10px 12px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface)}
.msg--warn{border-color:rgba(180,83,9,.35);background:var(--warn-bg);color:#7c2d12}
.msg--bad{border-color:rgba(220,38,38,.35);background:var(--bad-bg);color:#7f1d1d}
.msg--good{border-color:rgba(15,138,74,.35);background:var(--good-bg);color:#14532d}
.status{display:flex;flex-wrap:wrap;gap:6px}

/* 입력 */
.field{display:grid;gap:4px}
.field>label,.lbl{font-size:13px;font-weight:600;color:var(--text-2)}
input[type=text],input[type=url],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;min-height:42px;padding:8px 10px;border:1px solid var(--line-2);border-radius:var(--r-md);background:#fff;color:#000}
textarea{resize:vertical;line-height:1.5}
textarea.code{font-family:var(--mono);font-size:12.5px}
.drop{border:1px dashed var(--line-2);border-radius:var(--r-lg);padding:10px;background:var(--surface)}
.drop[data-over="1"]{border-color:var(--primary);background:var(--blue-soft)}
.preview img{max-width:100%;max-height:260px;border:1px solid var(--line);border-radius:var(--r-md);display:block}
.check{display:flex;gap:8px;align-items:flex-start;padding:6px 0}
.check input{width:20px;height:20px;margin:2px 0 0;flex:none}

/* 탭 */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:10px;flex-wrap:wrap}
.tabs button{min-height:42px;padding:0 12px;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;color:var(--muted);font-weight:600;cursor:pointer}
.tabs button[aria-selected="true"]{color:#000;border-bottom-color:#000}
.ai{border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 14px;background:#fff}
pre.json{margin:0;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);font:12px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;max-height:260px;overflow:auto}

/* 값 확인 */
.vrow{border:1px solid var(--line);border-radius:var(--r-md);padding:10px;display:grid;gap:6px}
.vrow[data-sel="1"]{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.vrow__head{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}
blockquote.ev{margin:0;padding:4px 10px;border-left:3px solid var(--line-2);color:var(--text-2);font-size:13px}
.srcText{margin:0;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);white-space:pre-wrap;font:13px/1.6 var(--font);max-height:320px;overflow:auto}
mark{background:#fde68a;color:#000;padding:0 1px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}

/* 시각표 */
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{font-weight:600;color:var(--text-2);background:var(--surface)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md)}
.tbl table{min-width:640px}
.tbl--fit table{min-width:0}

/* 지킴이 화면 */
.keeper-head{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.banner{border:1px solid var(--line);border-left-width:6px;border-radius:var(--r-md);padding:12px 14px;background:var(--surface)}
.banner__stage{font-weight:700;font-size:17px}
.banner[data-stage="w1"]{border-left-color:var(--primary);background:var(--blue-soft)}
.banner[data-stage="w2"]{border-left-color:var(--warn);background:var(--warn-bg)}
.banner[data-stage="w3"],.banner[data-stage="open"]{border-left-color:var(--bad);background:var(--bad-bg)}
.banner[data-stage="end"]{border-left-color:#000}
.cd{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:12px 0}
.cd div{border:1px solid var(--line);border-radius:var(--r-md);padding:8px 4px;text-align:center;background:#fff}
.cd b{display:block;font:700 clamp(26px,8vw,54px)/1.1 var(--mono);font-variant-numeric:tabular-nums}
.cd span{font-size:12px;color:var(--muted)}
.respond{position:relative;z-index:60;display:grid;gap:8px}
.respond .btn{min-height:64px;font-size:19px}
.demo-flag{font-weight:700;color:#fff;background:#000;border-radius:var(--r-sm);padding:2px 8px;font-size:13px}
#flash{position:fixed;inset:0;background:var(--bad);opacity:0;pointer-events:none;z-index:55}
body.flash #flash{animation:flash 1s steps(1,end) infinite}
@keyframes flash{0%{opacity:.55}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){body.flash #flash{animation:none;opacity:.42}}

/* 연습 엔진 */
.prog{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-wrap:wrap;gap:4px}
.prog li{font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);white-space:nowrap}
.prog li[data-state="current"]{border-color:#000;color:#000;font-weight:700}
.prog li[data-state="done"]{color:var(--good);border-color:rgba(15,138,74,.35)}
.stage{border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;display:grid;gap:10px}
.qbar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.qbar span{display:block;height:100%;width:0;background:var(--primary)}
.qnum{font:700 28px/1.2 var(--mono);font-variant-numeric:tabular-nums}
canvas.cap{width:100%;max-width:240px;height:auto;border:1px solid var(--line);border-radius:var(--r-md);display:block}
.seats{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;max-width:420px}
.seat{appearance:none;min-height:26px;aspect-ratio:1;border:1px solid var(--blue-line);border-radius:4px;background:#fff;padding:0;cursor:pointer;font:600 10px/1 var(--mono);color:var(--muted)}
.seat[aria-pressed="true"]{background:var(--primary);border:3px solid #000;color:#fff}
.seat:disabled{cursor:not-allowed;border-color:var(--line);color:transparent;background:repeating-linear-gradient(45deg,#e5e7eb 0 3px,#f9fafb 3px 6px)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.bars{display:grid;gap:4px}
.bar{display:grid;grid-template-columns:52px minmax(0,1fr) 64px;gap:6px;align-items:center;font-size:12px}
.bar i{display:block;height:8px;background:var(--primary);border-radius:99px;min-width:2px}
.bar[data-over="1"] i{background:var(--warn)}
dl.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0;font-size:14px}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cat{appearance:none;text-align:left;border:1px solid var(--line-2);border-radius:var(--r-lg);background:#fff;padding:14px;min-height:84px;display:grid;gap:4px;align-content:start;cursor:pointer;color:#000;font:inherit}
.cat strong{font-size:16px}
.cat:hover{border-color:var(--primary);background:var(--blue-soft)}
.chat{display:grid;gap:10px}
.bubble{padding:10px 12px;border-radius:var(--r-lg);border:1px solid var(--line);overflow-wrap:anywhere;display:grid;gap:8px;min-width:0}
.bubble--user{justify-self:end;max-width:85%;background:var(--blue-soft);border-color:var(--blue-line)}
.bubble--svc{background:var(--surface)}
.cand{border:1px solid var(--line);border-radius:var(--r-md);background:#fff;padding:10px;display:grid;gap:4px;min-width:0}
.cand--ended{background:var(--surface);color:var(--text-2)}
.ended-group{border-top:1px dashed var(--line-2);padding-top:8px}
.findbar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 0 12px;margin-top:12px;z-index:20}
.findbar__in{display:flex;gap:8px}
.findbar__in input{flex:1;min-width:0}
ol.srcs{margin:0;padding-left:20px;display:grid;gap:10px;overflow-wrap:anywhere}
#pickInfo th{width:30%;white-space:nowrap}
@media (max-width:480px){#pickInfo th{white-space:normal}}
.sched{border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;display:grid;gap:6px;background:#fff}
.sched--today{border:2px solid var(--primary);background:var(--blue-soft)}
.sched--past,.sched--past .h3,.sched--past .check{color:var(--muted)}
.sched--past{background:var(--surface)}
.nofresh{font-size:clamp(26px,8vw,40px);font-weight:800;color:var(--bad);text-align:center;border:3px solid var(--bad);border-radius:var(--r-lg);padding:10px}

.foot{border-top:1px solid var(--line);padding-top:12px;padding-bottom:28px;font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<header class="top">
  <div class="top__in">
    <div class="top__row">
      <a class="top__name" href="#home">티켓 비서</a>
      <span class="tag">연습용</span>
      <a class="top__home" href="#home">홈</a>
    </div>
    <ol class="steps" id="steps" aria-label="현재 순서"></ol>
  </div>
  <div class="strip" id="strip" hidden></div>
</header>
<main id="view" class="wrap" tabindex="-1"></main>
<footer class="foot wrap">
  <p>가상 시뮬레이션입니다. 실제 예매처와 무관하며 실제 결제와 개인정보 입력이 없습니다.</p>
</footer>
<div id="flash" aria-hidden="true"></div>
<noscript><p class="wrap">이 화면은 자바스크립트가 켜져 있어야 동작합니다.</p></noscript>
<script>

}
function fmtSec(ms) { return ms == null ? '-' : (ms / 1000).toFixed(1) + '초'; }

  var d = new Date(ms), off = -d.getTimezoneOffset(), a = Math.abs(off);
